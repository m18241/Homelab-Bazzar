<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Bazaar - Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0d2137 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        p { font-size: 1.25rem; color: #94a3b8; max-width: 600px; margin-bottom: 2rem; }
        .features {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 1rem 2rem;
            border-radius: 8px;
        }
        .cta {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>🖥️ Homelab Bazaar</h1>
    <p>A curated marketplace for HDDs, SSDs, RAM, Raspberry Pi, and sensors. 
       Compare prices across retailers and find the best deals for your homelab.</p>
    <div class="features">
        <div class="feature">💾 Storage</div>
        <div class="feature">🧠 RAM</div>
        <div class="feature">🥧 Raspberry Pi</div>
        <div class="feature">📡 Sensors</div>
    </div>
    <p style="margin-top: 3rem; color: #64748b;">Coming Soon • Q1 2024</p>
</body>
</html>
